<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <title>Terms & Conditions</title>

    <script id="sap-ui-bootstrap" src="https://ui5.sap.com/resources/sap-ui-core.js" data-sap-ui-theme="sap_horizon"
        data-sap-ui-libs="sap.m" data-sap-ui-compat-version="edge" data-sap-ui-async="true" data-sap-ui-resourceroots='{
            "hpbuysell.adm.tncmgmt.popup": "./"
        }'>
        </script>

    <script>
        sap.ui.getCore().attachInit(function () {

            sap.ui.require([
                "sap/ui/core/Component",
                "sap/ui/core/ComponentContainer"
            ], async function (
                Component,
                ComponentContainer
            ) {

                const oComponent = await Component.create({
                    name: "hpbuysell.adm.tncmgmt.popup"
                });

                new ComponentContainer({
                    component: oComponent,
                    height: "100%"
                }).placeAt("content");

            });

        });
    </script>

    <style>
        .tcDocumentsContainer {
            width: 100%;
            box-sizing: border-box;
        }

        .tcDocumentSection {
            width: 100%;
            box-sizing: border-box;
        }

        .tcPdfScroll {
            overflow-y: scroll !important;
            overflow-x: hidden !important;
            scrollbar-gutter: stable;
            scrollbar-width: auto;
            scrollbar-color: #777 #eee;
        }

        .tcPdfScroll::-webkit-scrollbar {
            width: 12px;
        }

        .tcPdfScroll::-webkit-scrollbar-track {
            background: #eeeeee;
        }

        .tcPdfScroll::-webkit-scrollbar-thumb {
            background: #777777;
            border-radius: 6px;
            border: 2px solid #eeeeee;
        }

        .tcPdfScroll::-webkit-scrollbar-thumb:hover {
            background: #555555;
        }

        .tcMainTitle {
            font-size: 1.6rem !important;
            font-weight: 600 !important;
            line-height: 2.2rem !important;
            text-align: center !important;
        }

        .tcSubTypeTitle {
            font-size: 1.4rem !important;
            font-weight: 600 !important;
            line-height: 2rem !important;
        }
    </style>

</head>

<body class="sapUiBody">

    <div id="content"></div>

</body>

</html>
